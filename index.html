<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f2ed; --surface:#fbfaf7; --ink:#1f2430; --muted:#646a78; --line:#e3e0d8; --accent:#2a448f;
  --tint-l:92%; --tint-s:58%; --tone-l:38%; --tone-s:62%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
    --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
  --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}

/* header */
.head{margin-bottom:18px}
.head h1{
  margin:0; font-family:"Sora","Cairo",sans-serif; font-weight:700;
  font-size:clamp(26px,6vw,40px); letter-spacing:-.02em; line-height:1.1;
}
.head .name{margin:8px 0 0; font-size:17px; font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{
  font-size:13px; font-weight:600; color:var(--muted);
  background:var(--surface); border:1px solid var(--line);
  padding:4px 11px; border-radius:999px;
}

/* controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{
  font:inherit; font-weight:700; font-size:14px; border:0; background:none; color:var(--muted);
  padding:6px 18px; border-radius:9px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:14px;color:var(--muted);font-weight:600}
.status b{color:var(--ink)}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.days button{
  font:inherit; cursor:pointer; text-align:center; padding:8px 0 7px;
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.days .d{font-weight:700;font-size:14px;line-height:1}
.days .dots{display:flex;gap:3px;height:6px;align-items:center}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] .dots i{background:var(--bg)}
.days button.today .d::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin:4px auto 0}
.days button[aria-pressed="true"].today .d::after{background:var(--bg)}

/* course colours */
.c{
  --tint:hsl(var(--h) var(--tint-s) var(--tint-l));
  --tone:hsl(var(--h) var(--tone-s) var(--tone-l));
}
.c.lec{--h:222}
.c.cls{--h:34}
.c.lab{--h:162}

/* day view */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.dayhead h2{margin:0;font-family:"Sora","Cairo",sans-serif;font-size:22px;letter-spacing:-.01em}
.dayhead .ar{font-size:20px;font-weight:700;color:var(--muted)}
.row{display:grid;grid-template-columns:54px 1fr;gap:12px;margin-bottom:10px}
.time{font-family:"Sora",sans-serif;font-size:13px;font-weight:600;text-align:end;padding-top:12px;line-height:1.35}
.time small{display:block;color:var(--muted);font-weight:500}
.card{
  background:var(--tint); border-radius:16px; padding:12px 14px 13px;
  border-inline-start:6px solid var(--tone);
}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-family:"Sora",sans-serif;font-weight:700;font-size:15px;color:var(--tone)}
.badge{
  font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;
  background:var(--surface);color:var(--ink);
}
.badge.now{background:var(--ink);color:var(--bg)}
.card h3{margin:5px 0 0;font-size:20px;line-height:1.35;text-align:start;font-weight:800}
.note{margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--tone) 30%,transparent);font-size:14px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.note b{font-size:12.5px;color:var(--tone);font-weight:700}
.info{margin-top:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.info div{display:flex;gap:7px;align-items:baseline}
.info svg{width:14px;height:14px;flex:none;align-self:center;stroke:var(--tone);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gap{margin:-2px 0 10px 0;margin-inline-start:66px;font-size:13px;color:var(--muted);font-weight:600;padding-inline-start:14px;border-inline-start:2px dashed var(--line)}
.empty{
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
  padding:34px 16px;text-align:center;color:var(--muted);font-weight:600
}

/* week view */
.weekscroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(104px,1fr));min-width:820px}
.week .hd{
  padding:10px 6px 8px;text-align:center;border-bottom:1px solid var(--line);
  font-weight:700;font-size:14px;line-height:1.2;
}
.week .hd small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.week .hd.today{color:var(--accent)}
.axis,.col{position:relative;height:calc(450px * var(--px))}
.axis span{
  position:absolute;inset-inline-end:6px;transform:translateY(-50%);
  font-family:"Sora",sans-serif;font-size:11px;font-weight:600;color:var(--muted)
}
.col{border-inline-start:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px)));
}
.col.today{background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.blk{
  position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 7px;overflow:hidden;
  background:var(--tint);border-inline-start:4px solid var(--tone);font-size:12px;line-height:1.25;
}
.blk .code{font-size:12.5px;display:block}
.blk .nm{display:block;font-weight:700;font-size:12.5px;line-height:1.3}
.blk .ty{font-weight:700}
.blk .rm{color:var(--muted);font-weight:600;display:block;margin-top:1px}
.hint{margin:8px 4px 0;font-size:13px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--tone)}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:46px 1fr;gap:10px}
  .gap{margin-inline-start:56px}
  .days button{padding:7px 0 6px}
}
.lang{margin-inline-start:auto}
.lang button{padding:6px 14px}
.dayhead .sub{font-size:18px;font-weight:700;color:var(--muted)}
.ico-btn{display:flex;align-items:center;padding:6px 11px!important}
.ico-btn svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.days button.off{opacity:.45}
.status{font-size:13.5px}
@media (max-width:600px){
  .wrap{padding:14px 12px 28px}
  .head{margin-bottom:10px}
  .head h1{font-size:25px}
  .head .name{font-size:15px;margin-top:4px}
  .meta{margin-top:8px;gap:6px}
  .meta span{font-size:12px;padding:2px 9px}
  #m3{display:none}
  .bar{margin:12px 0 8px;gap:8px}
  .seg button{font-size:13px;padding:6px 13px}
  .lang button{padding:6px 10px}
  .status{font-size:12.5px;margin-bottom:8px!important}
  .days{gap:4px;margin-bottom:12px}
  .days .dots{display:none}
  .days button{padding:8px 0 6px;border-radius:10px}
  .days .d{font-size:13px}
  .dayhead{margin:2px 2px 8px}
  .dayhead h2{font-size:19px}
  .dayhead .sub{display:none}
  .row{margin-bottom:8px}
  .card{padding:10px 12px 11px;border-radius:14px}
  .code{font-size:13px}
  .badge{font-size:11.5px}
  .card h3{font-size:18px;margin-top:3px}
  .info{margin-top:5px;font-size:13px}
  .note{margin-top:7px;padding-top:6px;font-size:13px}
  .time{font-size:12.5px;padding-top:10px}
  .gap{font-size:12px;margin-bottom:8px;opacity:.8}
  .legend{margin-top:14px;gap:6px 12px}
  .legend span{font-size:12px}
  .foot{font-size:11.5px;margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1 id="ttl"></h1>
    <p class="name" dir="rtl" lang="ar">يوسف الصياد</p>
    <div class="meta"><span id="m1"></span><span id="m2"></span><span id="m3"></span></div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="vDay" aria-pressed="true"></button>
      <button id="vWeek" aria-pressed="false"></button>
    </div>
    <div class="seg lang" role="group" aria-label="Language">
      <button id="lEn" aria-pressed="true">EN</button>
      <button id="lAr" aria-pressed="false" lang="ar">عربي</button>
    </div>
    <div class="seg"><button id="thm" class="ico-btn" type="button"></button></div>
  </div>
  <div class="status" id="status" style="margin:0 2px 12px"></div>

  <section id="dayView">
    <div class="days" id="days"></div>
    <div id="dayBody"></div>
  </section>

  <section id="weekView" hidden>
    <div class="weekscroll"><div class="week" id="week"></div></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="legend" id="legend"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
const T={
  en:{title:"Weekly timetable",level:"Junior",program:"Biomedical & Bio-systems Engineering · 2020 program",
    advisor:"Advisor: Eng. Atallah Mohamed Ali",day:"Day",week:"Week",now:"Now",today:"Today",next:"next",at:"at",
    nowL:"now",done:"done for today",none:"no classes",free:"Free",prof:"Professor",
    empty:"No classes. Enjoy the free day.",hint:"Swipe sideways to see every day.",
    foot:"English names are my translations and transliterations of the Arabic originals. Check them against your official schedule.",
    Lecture:"Lecture",Class:"Class",Lab:"Lab",h:"h",m:"m"},
  ar:{title:"الجدول الأسبوعي",level:"المستوى: Junior",program:"الهندسة الطبية والحيوية · برنامج 2020",
    advisor:"المرشد: المهندس / عطاالله محمد علي",day:"يوم",week:"أسبوع",now:"الآن",today:"اليوم",next:"التالي",at:"الساعة",
    nowL:"الآن",done:"انتهت محاضرات اليوم",none:"لا توجد محاضرات",free:"فراغ",prof:"الأستاذ",
    empty:"لا توجد محاضرات. استمتع بيوم الراحة.",hint:"مرّر جانبًا لرؤية كل الأيام.",foot:"",
    Lecture:"محاضرة",Class:"فصل",Lab:"معمل",h:"س",m:"د"}
};
const DAYS=[
  {en:"Saturday",ar:"السبت"},{en:"Sunday",ar:"الأحد"},{en:"Monday",ar:"الأثنين"},
  {en:"Tuesday",ar:"الثلاثاء"},{en:"Wednesday",ar:"الأربعاء"},{en:"Thursday",ar:"الخميس"},{en:"Friday",ar:"الجمعة"}
];
const COURSES={
  ECE295:{en:"Signal Analysis",ar:"تحليل إشارات"},
  BME228:{en:"Biochemistry",ar:"كيمياء حيوية"},
  ECE284:{en:"Electromagnetic Fields",ar:"مجالات كهرومغناطيسية"},
  BME238:{en:"Introduction to Anatomy",ar:"مقدمة لعلم التشريح"},
  CSE221:{en:"Automatic Control",ar:"تحكم آلي"},
  UNR241:{en:"Communication and Presentation Skills",ar:"مهارات الاتصال والعرض"},
  CSE364:{en:"Medical Internet of Things",ar:"إنترنت الأشياء الطبية"}
};
const PLACE={en:"Specialized Programs",ar:"البرامج النوعية"};
const R304={en:"H304 · Room 304",ar:"مبنى H304 · قاعة 304"};
const R307={en:"H307 · Room 307",ar:"مبنى H307 · قاعة 307"};
const B6217={en:"B6217 · Block 6",ar:"B6217 · بلوك 6"};
const B6216={en:"B6216 · Block 6",ar:"B6216 · بلوك 6"};
const B2014={en:"B2014 · Block 2",ar:"B2014 · بلوك 2"};
const WHO1={en:"Prof. Dr. Noura Ibrahim Anwar Pasha",ar:"أ.د. نورا ابراهيم انور باشا"};
const WHO2={en:"Seham Abdel Sameea Attia El-Sayed Ali",ar:"سهام عبد السميع عطية السيد علي"};
const CLASSES=[
  {d:1,s:"08:30",e:"10:00",c:"ECE295",k:"Lecture",room:R304,place:PLACE,who:WHO1},
  {d:1,s:"10:00",e:"11:30",c:"BME228",k:"Lecture",room:R304,place:PLACE},
  {d:1,s:"11:30",e:"13:00",c:"ECE284",k:"Lecture",room:R307,place:PLACE,who:WHO2},
  {d:1,s:"13:00",e:"13:45",c:"BME228",k:"Class",n:1,room:B6217},
  {d:1,s:"13:45",e:"14:30",c:"BME228",k:"Lab",n:1,room:B6217},
  {d:2,s:"09:15",e:"10:00",c:"UNR241",k:"Lecture",room:R304,place:PLACE},
  {d:2,s:"13:00",e:"13:45",c:"BME238",k:"Lab",n:2,room:B6217},
  {d:2,s:"13:45",e:"14:30",c:"BME238",k:"Class",n:2,room:B6217},
  {d:2,s:"14:30",e:"16:00",c:"CSE221",k:"Lecture",room:R307,place:PLACE},
  {d:3,s:"10:00",e:"11:30",c:"ECE284",k:"Class",n:1,room:B2014},
  {d:3,s:"11:30",e:"13:00",c:"ECE295",k:"Class",n:1,
    room:{en:"Room 123 · Electronic Circuits Lab",ar:"123 · معمل الدوائر الإلكترونية"},
    place:{en:"ECE labs",ar:"معامل هندسة الإلكترونيات والاتصالات"}},
  {d:4,s:"10:00",e:"11:30",c:"CSE221",k:"Class",n:1,room:B2014},
  {d:4,s:"11:30",e:"13:00",c:"UNR241",k:"Class",n:1,room:B6216},
  {d:4,s:"13:00",e:"14:30",c:"BME238",k:"Lecture",room:R307,place:PLACE},
  {d:5,s:"10:00",e:"11:30",c:"CSE364",k:"Lecture",room:R307,place:PLACE},
  {d:5,s:"13:00",e:"14:30",c:"CSE364",k:"Class",n:2,room:B6217}
];
const KIND={Lecture:"lec",Class:"cls",Lab:"lab"};
const $=id=>document.getElementById(id);
const m=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fmt=t=>{const[a,b]=t.split(":");return (+a)+":"+b};
const byDay=d=>CLASSES.filter(x=>x.d===d).sort((a,b)=>m(a.s)-m(b.s));
const ico='<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

let lang="en";
try{const s=localStorage.getItem("tt-lang");lang=s||((navigator.language||"").startsWith("ar")?"ar":"en")}catch(e){}
let view=window.innerWidth>=760?"week":"day";

const L=()=>T[lang];
const tn=x=>L()[x.k]+(x.n?" "+x.n:"");
const mins=n=>(n>=60?Math.floor(n/60)+L().h+" ":"")+(n%60?n%60+L().m:"");
const dur=x=>mins(m(x.e)-m(x.s)).trim();

const now=new Date();
const todayIdx=(now.getDay()+1)%7;
const nowMin=now.getHours()*60+now.getMinutes();
let sel=todayIdx;

function renderDays(){
  const box=$("days");box.innerHTML="";
  DAYS.forEach((d,i)=>{
    const n=byDay(i).length;
    const b=document.createElement("button");
    b.type="button";
    b.className=(i===todayIdx?"today ":"")+(n?"":"off");
    b.setAttribute("aria-pressed",i===sel);
    const nm=lang==="ar"?d.ar:d.en.slice(0,3);
    b.innerHTML='<span class="d">'+nm+'</span><span class="dots">'+Array.from({length:Math.min(n,5)},()=>"<i></i>").join("")+'</span>';
    b.onclick=()=>{sel=i;renderDays();renderDay()};
    box.appendChild(b);
  });
}

function renderDay(){
  const d=DAYS[sel],list=byDay(sel),other=lang==="ar"?"en":"ar";
  let h=`<div class="dayhead"><h2>${d[lang]}</h2><span class="sub" ${other==="ar"?'dir="rtl" lang="ar"':''}>${d[other]}</span></div>`;
  if(!list.length)h+=`<div class="empty">${L().empty}</div>`;
  list.forEach((x,i)=>{
    const c=COURSES[x.c];
    const live=sel===todayIdx&&nowMin>=m(x.s)&&nowMin<m(x.e);
    if(i>0){const g=m(x.s)-m(list[i-1].e);if(g>0)h+=`<div class="gap">${L().free} · ${mins(g).trim()}</div>`}
    h+=`<div class="row"><div class="time">${fmt(x.s)}<small>${fmt(x.e)}</small></div>
      <article class="card c ${KIND[x.k]}">
        <div class="top"><span class="code">${x.c}</span><span class="badge">${tn(x)}</span>${live?`<span class="badge now">${L().now}</span>`:""}</div>
        <h3>${c[lang]}</h3>
        <div class="info"><div>${ico}<span>${x.room[lang]}${x.place&&x.place!==PLACE?" · "+x.place[lang]:""}</span></div></div>
        ${x.who?`<div class="note"><b>${L().prof}</b><span>${x.who[lang]}</span></div>`:""}
      </article></div>`;
  });
  $("dayBody").innerHTML=h;
}

function renderWeek(){
  const PX=1.25,w=$("week");
  w.style.setProperty("--px",PX);
  let h='<div class="hd"></div>';
  DAYS.forEach((d,i)=>{
    const other=lang==="ar"?"en":"ar";
    h+=`<div class="hd${i===todayIdx?" today":""}">${lang==="ar"?d.ar:d.en.slice(0,3)}<small>${lang==="ar"?d.en.slice(0,3):d.ar}</small></div>`;
  });
  h+=`<div class="axis" style="--px:${PX}">`;
  for(let t=510;t<=960;t+=45){h+=`<span style="top:${(t-510)*PX}px">${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}</span>`}
  h+='</div>';
  DAYS.forEach((d,i)=>{
    h+=`<div class="col${i===todayIdx?" today":""}" style="--px:${PX}">`;
    byDay(i).forEach(x=>{
      const c=COURSES[x.c];
      const top=(m(x.s)-510)*PX+1,ht=(m(x.e)-m(x.s))*PX-2;
      h+=`<div class="blk c ${KIND[x.k]}" style="top:${top}px;height:${ht}px" title="${c[lang]}">
        <span class="code">${x.c}</span><span class="nm">${c[lang]}</span>
        ${ht>70?`<span class="ty">${tn(x)}</span>`:""}
        ${ht>100?`<span class="rm">${x.room[lang].split(" · ")[0]}</span>`:""}</div>`;
    });
    h+='</div>';
  });
  w.innerHTML=h;
}

function renderLegend(){
  $("legend").innerHTML=["Lecture","Class","Lab"].map(k=>`<span class="c ${KIND[k]}"><i></i>${L()[k]}</span>`).join("");
}

function renderStatus(){
  const list=byDay(todayIdx);
  const cur=list.find(x=>nowMin>=m(x.s)&&nowMin<m(x.e));
  const nxt=list.find(x=>m(x.s)>nowMin);
  let s=`${L().today}: <b>${DAYS[todayIdx][lang]}</b>`;
  if(cur)s+=` · ${L().nowL} <b>${cur.c}</b>`;
  else if(nxt)s+=` · ${L().next} <b>${nxt.c}</b> ${L().at} ${fmt(nxt.s)}`;
  else s+=" · "+(list.length?L().done:L().none);
  $("status").innerHTML=s;
}

function setView(v){
  view=v;
  $("vDay").setAttribute("aria-pressed",v==="day");
  $("vWeek").setAttribute("aria-pressed",v==="week");
  $("dayView").hidden=v!=="day";
  $("weekView").hidden=v!=="week";
}

function setLang(l){
  lang=l;
  try{localStorage.setItem("tt-lang",l)}catch(e){}
  const de=document.documentElement;
  de.lang=l;de.dir=l==="ar"?"rtl":"ltr";
  $("lEn").setAttribute("aria-pressed",l==="en");
  $("lAr").setAttribute("aria-pressed",l==="ar");
  document.title=L().title;
  $("ttl").textContent=L().title;
  $("m1").textContent=L().level;$("m2").textContent=L().program;$("m3").textContent=L().advisor;
  $("vDay").textContent=L().day;$("vWeek").textContent=L().week;
  $("hint").textContent=L().hint;
  $("foot").textContent=L().foot;
  renderDays();renderDay();renderWeek();renderLegend();renderStatus();
}

$("vDay").onclick=()=>setView("day");
$("vWeek").onclick=()=>setView("week");
$("lEn").onclick=()=>setLang("en");
$("lAr").onclick=()=>setLang("ar");
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
let theme="light";
try{theme=localStorage.getItem("tt-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}
function setTheme(t){
  theme=t;
  try{localStorage.setItem("tt-theme",t)}catch(e){}
  document.documentElement.setAttribute("data-theme",t);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute("content",t==="dark"?"#0e1320":"#f4f2ed");
  const b=$("thm");
  b.innerHTML=t==="dark"?SUN:MOON;
  b.setAttribute("aria-label",t==="dark"?"Switch to light mode":"Switch to dark mode");
}
$("thm").onclick=()=>setTheme(theme==="dark"?"light":"dark");
setTheme(theme);
setLang(lang);
setView(view);
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
