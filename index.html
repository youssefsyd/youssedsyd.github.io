<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f2ed; --surface:#fbfaf7; --ink:#1f2430; --muted:#646a78; --line:#e3e0d8; --accent:#2a448f;
  --tint-l:92%; --tint-s:58%; --tone-l:38%; --tone-s:62%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
    --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
  --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}

/* header */
.head{margin-bottom:18px}
.head h1{
  margin:0; font-family:"Sora","Cairo",sans-serif; font-weight:700;
  font-size:clamp(26px,6vw,40px); letter-spacing:-.02em; line-height:1.1;
}
.head .name{margin:8px 0 0; font-size:17px; font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{
  font-size:13px; font-weight:600; color:var(--muted);
  background:var(--surface); border:1px solid var(--line);
  padding:4px 11px; border-radius:999px;
}

/* controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{
  font:inherit; font-weight:700; font-size:14px; border:0; background:none; color:var(--muted);
  padding:6px 18px; border-radius:9px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:14px;color:var(--muted);font-weight:600}
.status b{color:var(--ink)}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.days button{
  font:inherit; cursor:pointer; text-align:center; padding:8px 0 7px;
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.days .d{font-weight:700;font-size:14px;line-height:1}
.days .dots{display:flex;gap:3px;height:6px;align-items:center}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] .dots i{background:var(--bg)}
.days button.today .d::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin:4px auto 0}
.days button[aria-pressed="true"].today .d::after{background:var(--bg)}

/* course colours */
.c{
  --tint:hsl(var(--h) var(--tint-s) var(--tint-l));
  --tone:hsl(var(--h) var(--tone-s) var(--tone-l));
}
.c.lec{--h:222}
.c.cls{--h:34}
.c.lab{--h:162}

/* day view */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.dayhead h2{margin:0;font-family:"Sora","Cairo",sans-serif;font-size:22px;letter-spacing:-.01em}
.dayhead .ar{font-size:20px;font-weight:700;color:var(--muted)}
.row{display:grid;grid-template-columns:54px 1fr;gap:12px;margin-bottom:10px}
.time{font-family:"Sora",sans-serif;font-size:13px;font-weight:600;text-align:end;padding-top:12px;line-height:1.35}
.time small{display:block;color:var(--muted);font-weight:500}
.card{
  background:var(--tint); border-radius:16px; padding:12px 14px 13px;
  border-inline-start:6px solid var(--tone);
}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-family:"Sora",sans-serif;font-weight:700;font-size:15px;color:var(--tone)}
.badge{
  font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;
  background:var(--surface);color:var(--ink);
}
.badge.now{background:var(--ink);color:var(--bg)}
.card h3{margin:5px 0 0;font-size:20px;line-height:1.35;text-align:start;font-weight:800}
.note{margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--tone) 30%,transparent);font-size:14px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.note b{font-size:12.5px;color:var(--tone);font-weight:700}
.info{margin-top:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.info div{display:flex;gap:7px;align-items:baseline}
.info svg{width:14px;height:14px;flex:none;align-self:center;stroke:var(--tone);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gap{margin:-2px 0 10px 0;margin-inline-start:66px;font-size:13px;color:var(--muted);font-weight:600;padding-inline-start:14px;border-inline-start:2px dashed var(--line)}
.empty{
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
  padding:34px 16px;text-align:center;color:var(--muted);font-weight:600
}

/* week view */
.weekscroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(104px,1fr));min-width:820px}
.week .hd{
  padding:10px 6px 8px;text-align:center;border-bottom:1px solid var(--line);
  font-weight:700;font-size:14px;line-height:1.2;
}
.week .hd small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.week .hd.today{color:var(--accent)}
.axis,.col{position:relative;height:calc(450px * var(--px))}
.axis span{
  position:absolute;inset-inline-end:6px;transform:translateY(-50%);
  font-family:"Sora",sans-serif;font-size:11px;font-weight:600;color:var(--muted)
}
.col{border-inline-start:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px)));
}
.col.today{background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.blk{
  position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 7px;overflow:hidden;
  background:var(--tint);border-inline-start:4px solid var(--tone);font-size:12px;line-height:1.25;
}
.blk .code{font-size:12.5px;display:block}
.blk .nm{display:block;font-weight:700;font-size:12.5px;line-height:1.3}
.blk .ty{font-weight:700}
.blk .rm{color:var(--muted);font-weight:600;display:block;margin-top:1px}
.hint{margin:8px 4px 0;font-size:13px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--tone)}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:46px 1fr;gap:10px}
  .gap{margin-inline-start:56px}
  .days button{padding:7px 0 6px}
}
.lang{margin-inline-start:auto}
.lang button{padding:6px 14px}
.dayhead .sub{font-size:18px;font-weight:700;color:var(--muted)}
.ico-btn{display:flex;align-items:center;padding:6px 11px!important}
.ico-btn svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.days button.off{opacity:.45}
.status{font-size:13.5px}
@media (max-width:600px){
  .wrap{padding:14px 12px 28px}
  .head{margin-bottom:10px}
  .head h1{font-size:25px}
  .head .name{font-size:15px;margin-top:4px}
  .meta{margin-top:8px;gap:6px}
  .meta span{font-size:12px;padding:2px 9px}
  #m3{display:none}
  .bar{margin:12px 0 8px;gap:8px}
  .seg button{font-size:13px;padding:6px 13px}
  .lang button{padding:6px 10px}
  .status{font-size:12.5px;margin-bottom:8px!important}
  .days{gap:4px;margin-bottom:12px}
  .days .dots{display:none}
  .days button{padding:8px 0 6px;border-radius:10px}
  .days .d{font-size:13px}
  .dayhead{margin:2px 2px 8px}
  .dayhead h2{font-size:19px}
  .dayhead .sub{display:none}
  .row{margin-bottom:8px}
  .card{padding:10px 12px 11px;border-radius:14px}
  .code{font-size:13px}
  .badge{font-size:11.5px}
  .card h3{font-size:18px;margin-top:3px}
  .info{margin-top:5px;font-size:13px}
  .note{margin-top:7px;padding-top:6px;font-size:13px}
  .time{font-size:12.5px;padding-top:10px}
  .gap{font-size:12px;margin-bottom:8px;opacity:.8}
  .legend{margin-top:14px;gap:6px 12px}
  .legend span{font-size:12px}
  .foot{font-size:11.5px;margin-top:12px}
}

/* ---- v5 additions ---- */
.axis,.col{height:calc(500px * var(--px))}
.col{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(50px * var(--px) - 1px),var(--line) calc(50px * var(--px) - 1px),var(--line) calc(50px * var(--px)))}
.next{display:block;width:100%;text-align:start;font:inherit;color:var(--ink);cursor:pointer;border:0;margin:0 0 12px;padding:9px 12px 10px;border-radius:14px;background:var(--tint);border-inline-start:6px solid var(--tone)}
.next .lbl{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--tone);text-transform:uppercase;letter-spacing:.04em}
.next .t{font-weight:800;font-size:16px;line-height:1.3;margin-top:2px}
.next .s{font-size:12.5px;color:var(--muted);margin-top:1px;font-weight:600}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sh-h h2{margin:0;flex:1;font-family:"Sora","Cairo",sans-serif;font-size:19px}
.rb{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.rb svg,.item.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .rb svg,[dir="rtl"] .item.btn svg{transform:scaleX(-1)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;font-size:15.5px;text-align:start}
.item.btn{cursor:pointer}
.sw{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{inset-inline-start:21px}
.muted{color:var(--muted);font-size:13.5px;margin:4px 2px 10px}
.cn{display:flex;flex-direction:column;gap:0;min-width:0}
.cn b{font-size:13px}
.cn span{font-weight:700;font-size:15px}
.ctr{display:flex;align-items:center;gap:10px;flex:none}
.ctr button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer;line-height:1;padding:0}
.ctr output{min-width:22px;text-align:center;font-family:"Sora",sans-serif;font-weight:700;font-size:17px}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer}
.prev{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:14px;border:1px solid var(--line);margin:8px 0 12px;background:var(--bg)}
.acts{display:flex;gap:10px}
.acts button{flex:1;font:inherit;font-weight:700;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.acts .pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts .sec{background:var(--bg);color:var(--ink)}
@media (max-width:600px){.next{margin-bottom:10px;padding:8px 11px 9px}.next .t{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1 id="ttl"></h1>
    <p class="name" dir="rtl" lang="ar">يوسف ابراهيم راضي الصياد</p>
    <div class="meta"><span id="m1"></span><span id="m2"></span><span id="m3"></span></div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="vDay" aria-pressed="true"></button>
      <button id="vWeek" aria-pressed="false"></button>
    </div>
    <div class="seg lang" role="group" aria-label="Language">
      <button id="lEn" aria-pressed="true">EN</button>
      <button id="lAr" aria-pressed="false" lang="ar">عربي</button>
    </div>
    <div class="seg"><button id="mnu" class="ico-btn" type="button" aria-haspopup="dialog"></button></div>
  </div>

  <div id="nextWrap"></div>

  <section id="dayView">
    <div class="days" id="days"></div>
    <div id="dayBody"></div>
  </section>

  <section id="weekView" hidden>
    <div class="weekscroll"><div class="week" id="week"></div></div>
    <p class="hint" id="hint"></p>
  </section>

  <div class="legend" id="legend"></div>
  <p class="foot" id="foot"></p>
</div>

<div class="overlay" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

const T={

  {d:4,p:2,n:2,c:"CSE221",k:"Class",num:1,room:B2014},

const HUE={lec:222,cls:34,lab:162};

const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
const byDay=d=>CLASSES.filter(x=>x.d===d).sort((a,b)=>a.s-b.s);
const ico='<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const MENU='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>';
const XI='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const BACK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const CHEV='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';

let lang="en";
try{const s=localStorage.getItem("tt-lang");lang=s||((navigator.language||"").startsWith("ar")?"ar":"en")}catch(e){}
let view=window.innerWidth>=760?"week":"day";
let showNext=true;try{showNext=localStorage.getItem("tt-next")!=="0"}catch(e){}
let abs={};try{abs=JSON.parse(localStorage.getItem("tt-abs")||"{}")||{}}catch(e){}
const saveAbs=()=>{try{localStorage.setItem("tt-abs",JSON.stringify(abs))}catch(e){}};

const L=()=>T[lang];
const tn=x=>L()[x.k]+(x.num?" "+x.num:"");
const mins=n=>((n>=60?Math.floor(n/60)+L().h+" ":"")+(n%60?n%60+L().m:"")).trim();
const nowParts=()=>{const d=new Date();return{idx:(d.getDay()+1)%7,min:d.getHours()*60+d.getMinutes()}};
let sel=nowParts().idx;

/* ---------- day strip + day view ---------- */
function renderDays(){
  const box=$("days");box.innerHTML="";
  const today=nowParts().idx;
  DAYS.forEach((d,i)=>{
    const n=byDay(i).length;
    const b=document.createElement("button");
    b.type="button";
    b.className=(i===today?"today ":"")+(n?"":"off");
    b.setAttribute("aria-pressed",i===sel);
    b.innerHTML='<span class="d">'+(lang==="ar"?d.ar:d.en.slice(0,3))+'</span><span class="dots">'+Array.from({length:Math.min(n,5)},()=>"<i></i>").join("")+'</span>';
    b.onclick=()=>{sel=i;renderDays();renderDay()};
    box.appendChild(b);
  });
}

function renderDay(){
  const d=DAYS[sel],list=byDay(sel),other=lang==="ar"?"en":"ar";
  const {idx,min}=nowParts();
  let h=`<div class="dayhead"><h2>${d[lang]}</h2><span class="sub" ${other==="ar"?'dir="rtl" lang="ar"':''}>${d[other]}</span></div>`;
  if(!list.length)h+=`<div class="empty">${L().empty}</div>`;
  list.forEach((x,i)=>{
    const c=COURSES[x.c];
    const live=sel===idx&&min>=x.s&&min<x.e;
    if(i>0){const g=x.s-list[i-1].e;if(g>0)h+=`<div class="gap">${L().free} · ${mins(g)}</div>`}
    h+=`<div class="row"><div class="time">${fmt(x.s)}<small>${fmt(x.e)}</small></div>
      <article class="card c ${KIND[x.k]}">
        <div class="top"><span class="code">${x.c}</span><span class="badge">${tn(x)}</span>${live?`<span class="badge now">${L().now}</span>`:""}</div>
        <h3>${c[lang]}</h3>
        <div class="info"><div>${ico}<span>${x.room[lang]}${x.place&&x.place!==PLACE?" · "+x.place[lang]:""}</span></div></div>
        ${x.who?`<div class="note"><b>${L().prof}</b><span>${x.who[lang]}</span></div>`:""}
      </article></div>`;
  });
  $("dayBody").innerHTML=h;
}

/* ---------- week view ---------- */
function renderWeek(){
  const PX=1.25,w=$("week"),today=nowParts().idx;
  w.style.setProperty("--px",PX);
  let h='<div class="hd"></div>';
  DAYS.forEach((d,i)=>{
    h+=`<div class="hd${i===today?" today":""}">${lang==="ar"?d.ar:d.en.slice(0,3)}<small>${lang==="ar"?d.en.slice(0,3):d.ar}</small></div>`;
  });
  h+=`<div class="axis" style="--px:${PX}">`;
  for(let t=START;t<=END;t+=PERIOD){h+=`<span style="top:${(t-START)*PX}px">${fmt(t)}</span>`}
  h+='</div>';
  DAYS.forEach((d,i)=>{
    h+=`<div class="col${i===today?" today":""}" style="--px:${PX}">`;
    byDay(i).forEach(x=>{
      const c=COURSES[x.c];
      const top=(x.s-START)*PX+1,ht=(x.e-x.s)*PX-2;
      h+=`<div class="blk c ${KIND[x.k]}" style="top:${top}px;height:${ht}px" title="${c[lang]}">
        <span class="code">${x.c}</span><span class="nm">${c[lang]}</span>
        ${ht>70?`<span class="ty">${tn(x)}</span>`:""}
        ${ht>100?`<span class="rm">${x.room[lang].split(" · ")[0]}</span>`:""}</div>`;
    });
    h+='</div>';
  });
  w.innerHTML=h;
}

function renderLegend(){
  $("legend").innerHTML=["Lecture","Class","Lab"].map(k=>`<span class="c ${KIND[k]}"><i></i>${L()[k]}</span>`).join("");
}

/* ---------- next-class card ---------- */
function findNext(){
  const {idx,min}=nowParts();
  for(let off=0;off<=7;off++){
    const di=(idx+off)%7;
    for(const x of byDay(di)){
      if(off===0){if(min>=x.e)continue;return{x,off,di,live:min>=x.s}}
      return{x,off,di,live:false};
    }
  }
  return null;
}
function renderNext(){
  const w=$("nextWrap");
  const r=showNext?findNext():null;
  if(!r){w.innerHTML="";return}
  const {x,off,di,live}=r,c=COURSES[x.c],{min}=nowParts();
  const when=live?L().endsL(mins(x.e-min)):off===0?L().inL(mins(x.s-min)):(off===1?L().tomorrow:DAYS[di][lang])+" · "+fmt(x.s);
  w.innerHTML=`<button type="button" class="next c ${KIND[x.k]}">
    <div class="lbl"><span>${live?L().now:L().next}</span><span>${when}</span></div>
    <div class="t"><span class="code">${x.c}</span> ${c[lang]}</div>
    <div class="s">${tn(x)} · ${fmt(x.s)}–${fmt(x.e)} · ${x.room[lang]}</div></button>`;
  w.firstChild.onclick=()=>{sel=di;setView("day");renderDays();renderDay()};
}

/* ---------- view / language / theme ---------- */
function setView(v){
  view=v;
  $("vDay").setAttribute("aria-pressed",v==="day");
  $("vWeek").setAttribute("aria-pressed",v==="week");
  $("dayView").hidden=v!=="day";
  $("weekView").hidden=v!=="week";
}
function setLang(l){
  lang=l;
  try{localStorage.setItem("tt-lang",l)}catch(e){}
  const de=document.documentElement;
  de.lang=l;de.dir=l==="ar"?"rtl":"ltr";
  $("lEn").setAttribute("aria-pressed",l==="en");
  $("lAr").setAttribute("aria-pressed",l==="ar");
  document.title=L().title;
  $("ttl").textContent=L().title;
  $("m1").textContent=L().level;$("m2").textContent=L().program;$("m3").textContent=L().advisor;
  $("vDay").textContent=L().day;$("vWeek").textContent=L().week;
  $("hint").textContent=L().hint;$("foot").textContent=L().foot;
  $("mnu").setAttribute("aria-label",L().menu);
  renderDays();renderDay();renderWeek();renderLegend();renderNext();
}
let theme="light";
try{theme=localStorage.getItem("tt-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}
function setTheme(t){
  theme=t;
  try{localStorage.setItem("tt-theme",t)}catch(e){}
  document.documentElement.setAttribute("data-theme",t);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute("content",t==="dark"?"#0e1320":"#f4f2ed");
}
function setNext(v){showNext=v;try{localStorage.setItem("tt-next",v?"1":"0")}catch(e){}renderNext()}

/* ---------- menu sheet: settings, absences, export ---------- */
let screen="main",expUrl="",expBlob=null;
const sw=(a,on)=>`<button type="button" class="sw" role="switch" aria-checked="${on}" data-a="${a}"><i></i></button>`;
const head=(title,back)=>`<div class="sh-h">${back?`<button type="button" class="rb" data-a="back" aria-label="${L().back}">${BACK}</button>`:""}<h2>${title}</h2><button type="button" class="rb" data-a="close" aria-label="${L().close}">${XI}</button></div>`;

function renderSheet(){
  let h="";
  if(screen==="main"){
    h=head(L().menu,false)+
      `<div class="item"><span>${L().nextCard}</span>${sw("next",showNext)}</div>
       <div class="item"><span>${L().dark}</span>${sw("dark",theme==="dark")}</div>
       <button type="button" class="item btn" data-a="abs"><span>${L().abs}</span>${CHEV}</button>
       <button type="button" class="item btn" data-a="exp"><span>${L().exp}</span>${CHEV}</button>`;
  }else if(screen==="abs"){
    h=head(L().abs,true)+`<p class="muted">${L().absHint}</p>`+
      Object.keys(COURSES).map(k=>`<div class="item"><span class="cn"><b class="code">${k}</b><span>${COURSES[k][lang]}</span></span>
        <span class="ctr"><button type="button" data-a="dec" data-c="${k}" aria-label="−">−</button><output>${abs[k]||0}</output><button type="button" data-a="inc" data-c="${k}" aria-label="+">+</button></span></div>`).join("")+
      `<button type="button" class="link" data-a="reset">${L().reset}</button>`;
  }else{
    const canShare=!!(navigator.canShare&&expBlob&&navigator.canShare({files:[new File([expBlob],"timetable.png",{type:"image/png"})]}));
    h=head(L().exp,true)+(expUrl?
      `<img class="prev" src="${expUrl}" alt="${L().title}">
       <div class="acts"><button type="button" class="pri" data-a="save">${L().save}</button>${canShare?`<button type="button" class="sec" data-a="share">${L().share}</button>`:""}</div>
       <p class="muted">${L().expHint}</p>`:`<p class="muted">${L().making}</p>`);
  }
  $("sheet").innerHTML=h;
}
function openSheet(){screen="main";$("ov").hidden=false;document.body.style.overflow="hidden";renderSheet()}
function closeSheet(){$("ov").hidden=true;document.body.style.overflow=""}
$("mnu").innerHTML=MENU;
$("mnu").onclick=openSheet;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("sheet").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,c=b.dataset.c;
  if(a==="close")closeSheet();
  else if(a==="back"){screen="main";renderSheet()}
  else if(a==="next"){setNext(!showNext);renderSheet()}
  else if(a==="dark"){setTheme(theme==="dark"?"light":"dark");renderSheet()}
  else if(a==="abs"){screen="abs";renderSheet()}
  else if(a==="inc"){abs[c]=(abs[c]||0)+1;saveAbs();renderSheet()}
  else if(a==="dec"){abs[c]=Math.max(0,(abs[c]||0)-1);saveAbs();renderSheet()}
  else if(a==="reset"){if(confirm(L().resetQ)){abs={};saveAbs();renderSheet()}}
  else if(a==="exp"){screen="exp";expUrl="";expBlob=null;renderSheet();makeImage()}
  else if(a==="save"){const l=document.createElement("a");l.href=expUrl;l.download="timetable.png";document.body.appendChild(l);l.click();l.remove()}
  else if(a==="share"){navigator.share({files:[new File([expBlob],"timetable.png",{type:"image/png"})],title:L().title}).catch(()=>{})}
});

/* ---------- export as image (drawn on a canvas, no libraries) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,maxW){
  const words=text.split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
async function makeImage(){
  try{await document.fonts.load('700 24px Cairo');await document.fonts.load('700 24px Sora');await document.fonts.ready}catch(e){}
  const dark=theme==="dark",ar=lang==="ar";
  const col=dark?{bg:"#0e1320",ink:"#eef1f7",muted:"#9aa5bb",line:"#28324a"}:{bg:"#f4f2ed",ink:"#1f2430",muted:"#646a78",line:"#e3e0d8"};
  const tint=h=>dark?`hsl(${h} 38% 20%)`:`hsl(${h} 58% 92%)`;
  const tone=h=>dark?`hsl(${h} 75% 72%)`:`hsl(${h} 62% 38%)`;
  const days=DAYS.map((d,i)=>i).filter(i=>byDay(i).length);
  const n=days.length,W=1080,M=36,AX=88,PX=2.6,GX=ar?M:M+AX,colW=(W-2*M-AX)/n;
  const HY=232,GY=296,GB=GY+(END-START)*PX,H=GB+130;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const c=cv.getContext("2d");
  c.fillStyle=col.bg;c.fillRect(0,0,W,H);
  const FONT='Cairo, "Segoe UI", sans-serif',MONO='Sora, Cairo, sans-serif';
  const colX=j=>ar?GX+(n-1-j)*colW:GX+j*colW;
  // header
  c.textAlign=ar?"right":"left";const hx=ar?W-M:M;
  c.direction=ar?"rtl":"ltr";c.fillStyle=col.ink;c.font=`800 58px ${FONT}`;c.fillText(L().title,hx,100);
  c.direction="rtl";c.fillStyle=col.ink;c.font=`700 34px ${FONT}`;c.fillText("يوسف ابراهيم راضي الصياد",hx,158);
  c.direction=ar?"rtl":"ltr";c.fillStyle=col.muted;c.font=`600 25px ${FONT}`;c.fillText(L().level+" · "+L().program,hx,204);
  // day headers + grid
  c.textAlign="center";
  days.forEach((di,j)=>{
    const x=colX(j);
    c.fillStyle=dark?"#171e2e":"#fbfaf7";rr(c,x+4,HY,colW-8,54,14);c.fill();
    c.fillStyle=col.ink;c.direction=ar?"rtl":"ltr";c.font=`700 27px ${FONT}`;c.fillText(DAYS[di][lang],x+colW/2,HY+37);
  });
  c.strokeStyle=col.line;c.lineWidth=2;
  for(let t=START;t<=END;t+=PERIOD){
    const y=GY+(t-START)*PX;
    c.beginPath();c.moveTo(GX,y);c.lineTo(GX+n*colW,y);c.stroke();
    c.fillStyle=col.muted;c.direction="ltr";c.font=`600 22px ${MONO}`;c.textAlign="center";
    c.fillText(fmt(t),(ar?W-M-AX:M)+AX/2,y+8);
  }
  // blocks
  days.forEach((di,j)=>{
    const x0=colX(j);
    byDay(di).forEach(x=>{
      const kind=KIND[x.k],hue=HUE[kind];
      const bx=x0+6,bw=colW-12,by=GY+(x.s-START)*PX+4,bh=(x.e-x.s)*PX-8;
      c.fillStyle=tint(hue);rr(c,bx,by,bw,bh,16);c.fill();
      c.fillStyle=tone(hue);rr(c,ar?bx+bw-8:bx,by+12,8,bh-24,4);c.fill();
      const cx=bx+bw/2;let ty=by+36;
      c.textAlign="center";
      c.direction="ltr";c.font=`700 27px ${MONO}`;c.fillStyle=tone(hue);c.fillText(x.c,cx,ty);ty+=32;
      c.direction=ar?"rtl":"ltr";c.fillStyle=col.ink;
      {
        const nm=COURSES[x.c][lang],maxW=bw-30;let fs=24,lines=[];
        for(;fs>=14;fs--){
          c.font=`700 ${fs}px ${FONT}`;lines=wrap(c,nm,maxW);
          const wide=lines.some(l=>c.measureText(l).width>maxW);
          if(!wide&&ty+(lines.length-1)*fs*1.25<=by+bh-12)break;
        }
        for(const ln of lines){c.fillText(ln,cx,ty);ty+=fs*1.25}
        ty+=6;
      }
      c.font=`600 21px ${FONT}`;c.fillStyle=col.muted;
      if(ty<=by+bh-12){c.fillText(tn(x),cx,ty);ty+=27}
      if(ty<=by+bh-12){c.fillText(x.room[lang].split(" · ")[0],cx,ty)}
    });
  });
  // legend
  c.direction=ar?"rtl":"ltr";c.font=`700 24px ${FONT}`;
  const items=["Lecture","Class","Lab"].map(k=>({k,t:L()[k]}));
  const wd=items.map(i=>34+c.measureText(i.t).width);
  const total=wd.reduce((a,b)=>a+b,0)+(items.length-1)*44;
  let lx=(W-total)/2;const ly=GB+72;
  c.textAlign="left";
  items.forEach((i,k)=>{
    c.fillStyle=tone(HUE[KIND[i.k]]);rr(c,lx,ly-20,22,22,6);c.fill();
    c.fillStyle=col.ink;c.fillText(i.t,lx+34,ly);lx+=wd[k]+44;
  });
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!blob||screen!=="exp")return;
  if(expUrl)URL.revokeObjectURL(expUrl);
  expBlob=blob;expUrl=URL.createObjectURL(blob);renderSheet();
}

/* ---------- start ---------- */
setTheme(theme);
setLang(lang);
setView(view);
setInterval(()=>{if(!document.hidden)renderNext()},30000);
setInterval(()=>{if(!document.hidden&&sel===nowParts().idx)renderDay()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){renderNext();renderDays();renderDay()}});
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
