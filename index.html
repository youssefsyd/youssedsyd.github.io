<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f6; --surface:#ffffff; --ink:#101828; --muted:#5b6578; --line:#dde2ec; --accent:#1f3a8a;
  --tint-l:93%; --tint-s:75%; --tone-l:38%; --tone-s:70%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
    --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171e2e; --ink:#eef1f7; --muted:#9aa5bb; --line:#28324a; --accent:#9db4ff;
  --tint-l:20%; --tint-s:38%; --tone-l:72%; --tone-s:75%;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}

/* header */
.head{margin-bottom:18px}
.head h1{
  margin:0; font-family:"Sora","Cairo",sans-serif; font-weight:700;
  font-size:clamp(26px,6vw,40px); letter-spacing:-.02em; line-height:1.1;
}
.head .name{margin:8px 0 0; font-size:17px; font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{
  font-size:13px; font-weight:600; color:var(--muted);
  background:var(--surface); border:1px solid var(--line);
  padding:4px 11px; border-radius:999px;
}

/* controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{
  font:inherit; font-weight:700; font-size:14px; border:0; background:none; color:var(--muted);
  padding:6px 18px; border-radius:9px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:14px;color:var(--muted);font-weight:600}
.status b{color:var(--ink)}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.days button{
  font:inherit; cursor:pointer; text-align:center; padding:8px 0 7px;
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.days .d{font-weight:700;font-size:14px;line-height:1}
.days .dots{display:flex;gap:3px;height:6px;align-items:center}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] .dots i{background:var(--bg)}
.days button.today .d::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin:4px auto 0}
.days button[aria-pressed="true"].today .d::after{background:var(--bg)}

/* course colours */
.c{
  --tint:hsl(var(--h) var(--tint-s) var(--tint-l));
  --tone:hsl(var(--h) var(--tone-s) var(--tone-l));
}
.c.lec{--h:222}
.c.cls{--h:34}
.c.lab{--h:162}

/* day view */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.dayhead h2{margin:0;font-family:"Sora","Cairo",sans-serif;font-size:22px;letter-spacing:-.01em}
.dayhead .ar{font-size:20px;font-weight:700;color:var(--muted)}
.row{display:grid;grid-template-columns:54px 1fr;gap:12px;margin-bottom:10px}
.time{font-family:"Sora",sans-serif;font-size:13px;font-weight:600;text-align:right;padding-top:12px;line-height:1.35}
.time small{display:block;color:var(--muted);font-weight:500}
.card{
  background:var(--tint); border-radius:16px; padding:12px 14px 13px;
  border-inline-start:6px solid var(--tone);
}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-family:"Sora",sans-serif;font-weight:700;font-size:15px;color:var(--tone)}
.badge{
  font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;
  background:var(--surface);color:var(--ink);
}
.badge.now{background:var(--ink);color:var(--bg)}
.card h3{margin:5px 0 0;font-size:20px;line-height:1.35;text-align:left;font-weight:800}
.note{margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--tone) 30%,transparent);font-size:14px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.note b{font-size:12.5px;color:var(--tone);font-weight:700}
.info{margin-top:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.info div{display:flex;gap:7px;align-items:baseline}
.info svg{width:14px;height:14px;flex:none;align-self:center;stroke:var(--tone);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gap{margin:-2px 0 10px 66px;font-size:13px;color:var(--muted);font-weight:600;padding-inline-start:14px;border-inline-start:2px dashed var(--line)}
.empty{
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
  padding:34px 16px;text-align:center;color:var(--muted);font-weight:600
}

/* week view */
.weekscroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(104px,1fr));min-width:820px}
.week .hd{
  padding:10px 6px 8px;text-align:center;border-bottom:1px solid var(--line);
  font-weight:700;font-size:14px;line-height:1.2;
}
.week .hd small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.week .hd.today{color:var(--accent)}
.axis,.col{position:relative;height:calc(450px * var(--px))}
.axis span{
  position:absolute;right:6px;transform:translateY(-50%);
  font-family:"Sora",sans-serif;font-size:11px;font-weight:600;color:var(--muted)
}
.col{border-inline-start:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px) - 1px),var(--line) calc(45px * var(--px)));
}
.col.today{background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.blk{
  position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 7px;overflow:hidden;
  background:var(--tint);border-inline-start:4px solid var(--tone);font-size:12px;line-height:1.25;
}
.blk .code{font-size:12.5px;display:block}
.blk .nm{display:block;font-weight:700;font-size:12.5px;line-height:1.3}
.blk .ty{font-weight:700}
.blk .rm{color:var(--muted);font-weight:600;display:block;margin-top:1px}
.hint{margin:8px 4px 0;font-size:13px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--tone)}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:46px 1fr;gap:10px}
  .gap{margin-left:56px}
  .days button{padding:7px 0 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Weekly timetable</h1>
    <p class="name" dir="rtl" lang="ar">يوسف ابراهيم راضي ابراهيم اسماعيل الصياد</p>
    <div class="meta">
      <span>Junior</span>
      <span>Biomedical &amp; Bio-systems Engineering · 2020 program</span>
      <span>Advisor: Eng. Atallah Mohamed Ali</span>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="vDay" aria-pressed="true">Day</button>
      <button id="vWeek" aria-pressed="false">Week</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <section id="dayView">
    <div class="days" id="days"></div>
    <div id="dayBody"></div>
  </section>

  <section id="weekView" hidden>
    <div class="weekscroll"><div class="week" id="week"></div></div>
    <p class="hint">Swipe sideways to see every day.</p>
  </section>

  <div class="legend" id="legend"></div>
  
</div>

<script>
const DAYS=[
  {en:"Sat",full:"Saturday", ar:"السبت"},
  {en:"Sun",full:"Sunday",   ar:"الأحد"},
  {en:"Mon",full:"Monday",   ar:"الأثنين"},
  {en:"Tue",full:"Tuesday",  ar:"الثلاثاء"},
  {en:"Wed",full:"Wednesday",ar:"الأربعاء"},
  {en:"Thu",full:"Thursday", ar:"الخميس"},
  {en:"Fri",full:"Friday",   ar:"الجمعة"}
];
const COURSES={
  ECE295:{ar:"تحليل إشارات"},
  BME228:{ar:"كيمياء حيوية"},
  ECE284:{ar:"مجالات كهرومغناطيسية"},
  BME238:{ar:"مقدمة لعلم التشريح"},
  CSE221:{ar:"تحكم آلي"},
  UNR241:{ar:"مهارات الاتصال والعرض"},
  CSE364:{ar:"إنترنت الأشياء الطبية"}
};
const H304={room:"H304 · Room 304",place:"البرامج النوعية"};
const H307={room:"H307 · Room 307",place:"البرامج النوعية"};
const CLASSES=[
  // Sunday
  {d:1,s:"08:30",e:"10:00",c:"ECE295",t:"Lecture",...H304,who:"د. نورا ابراهيم انور باشا"},
  {d:1,s:"10:00",e:"11:30",c:"BME228",t:"Lecture",...H304},
  {d:1,s:"11:30",e:"13:00",c:"ECE284",t:"Lecture",...H307,who:"سهام عبد السميع عطية السيد علي"},
  {d:1,s:"13:00",e:"13:45",c:"BME228",t:"Class 1",room:"B6217 · Block 6"},
  {d:1,s:"13:45",e:"14:30",c:"BME228",t:"Lab 1",room:"B6217 · Block 6"},
  // Monday
  {d:2,s:"09:15",e:"10:00",c:"UNR241",t:"Lecture",...H304},
  {d:2,s:"13:00",e:"13:45",c:"BME238",t:"Lab 2",room:"B6217 · Block 6"},
  {d:2,s:"13:45",e:"14:30",c:"BME238",t:"Class 2",room:"B6217 · Block 6"},
  {d:2,s:"14:30",e:"16:00",c:"CSE221",t:"Lecture",...H307},
  // Tuesday
  {d:3,s:"10:00",e:"11:30",c:"ECE284",t:"Class 1",room:"B2014 · Block 2"},
  {d:3,s:"11:30",e:"13:00",c:"ECE295",t:"Class 1",room:"Room 123 · Electronic Circuits Lab",place:"ECE labs"},
  // Wednesday
  {d:4,s:"10:00",e:"11:30",c:"CSE221",t:"Class 1",room:"B2014 · Block 2"},
  {d:4,s:"11:30",e:"13:00",c:"UNR241",t:"Class 1",room:"B6216 · Block 6"},
  {d:4,s:"13:00",e:"14:30",c:"BME238",t:"Lecture",...H307},
  // Thursday
  {d:5,s:"10:00",e:"11:30",c:"CSE364",t:"Lecture",...H307},
  {d:5,s:"13:00",e:"14:30",c:"CSE364",t:"Class 2",room:"B6217 · Block 6"}
];
const kind=x=>x.t.startsWith("Lecture")?"lec":x.t.startsWith("Lab")?"lab":"cls";
const m=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fmt=t=>{const[a,b]=t.split(":");return (+a)+":"+b};
const dur=x=>{const n=m(x.e)-m(x.s);return (n>=60?Math.floor(n/60)+"h ":"")+(n%60?n%60+"m":"")};
const $=id=>document.getElementById(id);
const ico={
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>'
};
const byDay=d=>CLASSES.filter(x=>x.d===d).sort((a,b)=>m(a.s)-m(b.s));

const now=new Date();
const todayIdx=(now.getDay()+1)%7;           // Sat=0 ... Fri=6
const nowMin=now.getHours()*60+now.getMinutes();
let sel=todayIdx;

function renderDays(){
  const box=$("days");box.innerHTML="";
  DAYS.forEach((d,i)=>{
    const n=byDay(i).length;
    const b=document.createElement("button");
    b.type="button";
    b.className=i===todayIdx?"today":"";
    b.setAttribute("aria-pressed",i===sel);
    b.setAttribute("aria-label",d.full+", "+n+" classes");
    b.innerHTML='<span class="d">'+d.en+'</span><span class="dots">'+
      Array.from({length:Math.min(n,5)},()=>"<i></i>").join("")+'</span>';
    b.onclick=()=>{sel=i;renderDays();renderDay()};
    box.appendChild(b);
  });
}

function renderDay(){
  const d=DAYS[sel],list=byDay(sel);
  let h='<div class="dayhead"><h2>'+d.full+'</h2><span class="ar" dir="rtl" lang="ar">'+d.ar+'</span></div>';
  if(!list.length){
    h+='<div class="empty">No classes. Enjoy the free day.</div>';
  }
  list.forEach((x,i)=>{
    const c=COURSES[x.c];
    const live=sel===todayIdx&&nowMin>=m(x.s)&&nowMin<m(x.e);
    if(i>0){
      const g=m(x.s)-m(list[i-1].e);
      if(g>0)h+='<div class="gap">Free · '+(g>=60?Math.floor(g/60)+"h ":"")+(g%60?g%60+"m":"")+'</div>';
    }
    h+='<div class="row"><div class="time">'+fmt(x.s)+'<small>'+fmt(x.e)+'</small></div>'+
      '<article class="card c '+kind(x)+'">'+
      '<div class="top"><span class="code">'+x.c+'</span><span class="badge">'+x.t+'</span>'+
      '<span class="badge">'+dur(x)+'</span>'+(live?'<span class="badge now">Now</span>':'')+'</div>'+
      '<h3 dir="rtl" lang="ar">'+c.ar+'</h3>'+
      '<div class="info"><div>'+ico.pin+'<span>'+x.room+(x.place?' · <span dir="rtl" lang="ar">'+x.place+'</span>':'')+'</span></div></div>'+
      (x.who?'<div class="note"><b>Professor</b><span dir="rtl" lang="ar">'+x.who+'</span></div>':'')+
      '</article></div>';
  });
  $("dayBody").innerHTML=h;
}

function renderWeek(){
  const PX=1.25;
  const w=$("week");
  w.style.setProperty("--px",PX);
  let h='<div class="hd"></div>';
  DAYS.forEach((d,i)=>{h+='<div class="hd'+(i===todayIdx?' today':'')+'">'+d.en+'<small dir="rtl" lang="ar">'+d.ar+'</small></div>'});
  // axis
  h+='<div class="axis" style="--px:'+PX+'">';
  for(let t=510;t<=960;t+=45){
    const hh=Math.floor(t/60),mm=String(t%60).padStart(2,"0");
    h+='<span style="top:'+((t-510)*PX)+'px">'+hh+':'+mm+'</span>';
  }
  h+='</div>';
  DAYS.forEach((d,i)=>{
    h+='<div class="col'+(i===todayIdx?' today':'')+'" style="--px:'+PX+'">';
    byDay(i).forEach(x=>{
      const c=COURSES[x.c];
      const top=(m(x.s)-510)*PX+1, ht=(m(x.e)-m(x.s))*PX-2;
      h+='<div class="blk c '+kind(x)+'" style="top:'+top+'px;height:'+ht+'px" title="'+c.ar+'">'+
        '<span class="code">'+x.c+'</span><span class="nm" dir="rtl" lang="ar">'+c.ar+'</span>'+
        (ht>70?'<span class="ty">'+x.t+'</span>':'')+
        (ht>100?'<span class="rm">'+x.room.split(" · ")[0]+'</span>':'')+'</div>';
    });
    h+='</div>';
  });
  w.innerHTML=h;
}

function renderLegend(){
  $("legend").innerHTML=[["lec","Lecture","محاضرة"],["cls","Class","فصل"],["lab","Lab","معمل"]].map(([k,e,a])=>
    '<span class="c '+k+'"><i></i>'+e+' <span dir="rtl" lang="ar">'+a+'</span></span>').join("");
}

function renderStatus(){
  const list=byDay(todayIdx);
  const cur=list.find(x=>nowMin>=m(x.s)&&nowMin<m(x.e));
  const nxt=list.find(x=>m(x.s)>nowMin);
  let s='Today: <b>'+DAYS[todayIdx].full+'</b>';
  if(cur)s+=' · now <b>'+cur.c+'</b>';
  else if(nxt)s+=' · next <b>'+nxt.c+'</b> at '+fmt(nxt.s);
  else s+=list.length?' · done for today':' · no classes';
  $("status").innerHTML=s;
}

function setView(v){
  $("vDay").setAttribute("aria-pressed",v==="day");
  $("vWeek").setAttribute("aria-pressed",v==="week");
  $("dayView").hidden=v!=="day";
  $("weekView").hidden=v!=="week";
}
$("vDay").onclick=()=>setView("day");
$("vWeek").onclick=()=>setView("week");

renderDays();renderDay();renderWeek();renderLegend();renderStatus();
setView(window.innerWidth>=760?"week":"day");
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
